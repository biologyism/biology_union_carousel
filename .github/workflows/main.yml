# اجرای ربات روی GitHub Actions با ذخیره‌سازی دائمی کاروسل‌ها
# ---------------------------------------------------------------
# کاروسل‌ها در فایل state.json نگه داشته می‌شوند و ربات هر ۹۰ ثانیه آن را
# در همین ریپو کامیت می‌کند؛ بنابراین بعد از هر ری‌استارت هم دکمه‌های
# کاروسل‌های قبلی کار می‌کنند.
#
# محدودیت: هر اجرا حداکثر ۶ ساعت است. برای همین هر ۵ ساعت اجرای تازه
# جایگزین اجرای قبلی می‌شود (concurrency) و ربات تقریباً همیشه آنلاین است.
# برای آپ‌تایم ۱۰۰٪ از روش VPS + deploy.yml استفاده کنید.
name: Run Carousel Bot

on:
  push:
    branches: [main]
    paths-ignore:
      - "state.json"
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"   # هر ۵ ساعت اجرای تازه

permissions:
  contents: write           # برای کامیت کردن state.json

concurrency:
  group: carousel-bot
  cancel-in-progress: true  # اجرای تازه، اجرای قبلی را قطع می‌کند

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # زیر سقف ۶ ساعته گیت‌هاب
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FORWARD_CHAT_ID: ${{ secrets.FORWARD_CHAT_ID }}
          ALLOWED_USER_ID: ${{ secrets.ALLOWED_USER_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          STATE_PERSIST: git
          STATE_FILE: state.json
        run: python bot.py
